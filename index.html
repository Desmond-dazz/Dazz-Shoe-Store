<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Dazz-Store</title>
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="container header-flex">
        <p class="logo">Dazz-store</p>
        <ul class="navigation-desktop">
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="aboutUs.html">Contact Us</a></li>
          <li><i class="fa-solid fa-cart-shopping"></i></li>
        </ul>
        <ul class="navigation-mobile">
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="aboutUs.html">Contact Us</a></li>
        </ul>
        <li class="cart-icon"><i class="fa-solid fa-cart-shopping"></i></li>
        <i class="fa-solid fa-bars burger-menu"></i>
      </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
      <div class="hero-content">
        <div class="hero-left">
          <div class="hero-description">
            <h1>Effortless Style. All-Day Comfort</h1>
            <p>
              Thoughtfully designed footwear crafted from premium, breathable
              materials. Made to transition seamlessly from your morning commute
              to weekend unwinding.
            </p>
          </div>
          <button>Shop Now</button>
        </div>
        <div class="bars">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>

        <img
          class="hero-right"
          src="./images/shoes/Casaul/SoleDrop/SoleDrop 3.png"
          alt="SoleDrop Shoe"
        />
      </div>
    </section>
    <script src="./script.js"></script>
  </body>
</html>
